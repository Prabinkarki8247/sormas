const $=s=>document.querySelector(s);

/* ---------- 1. Build milestones from D (oldest first) ---------- */
const yr=s=>(String(s).match(/\d{4}/)||[""])[0];
const M=[];
D.education.slice().reverse().forEach(e=>M.push({y:yr(e[0]),k:"Education",t:e[1],s:e[2]}));
D.jobs.slice().reverse().forEach(j=>M.push({y:yr(j.y),k:"Role",t:j.t,s:j.y+" · "+j.o}));
D.awards.slice().reverse().forEach(a=>M.push({y:yr(a[0]),k:"Award",t:a[1],s:a[2]}));
D.pubs.filter(p=>p[0]==="original").forEach(p=>M.push({y:(p[1].match(/\. (20\d\d)/)||["",""])[1],k:"Publication",t:p[1].split(". ")[1],s:p[1].replace(/<[^>]+>/g,"").split(". ").slice(-2,-1)[0]}));
M.sort((a,b)=>a.y-b.y);

/* ---------- 2. Build the 3D corridor ---------- */
const W=640,H=420,PW=320,PH=270,GAP=330,START=520;
const n=M.length, L=START+n*GAP+800, MAXD=START+n*GAP+120;
const world=$("#world"), items=[];
const add=(cls,css,html="")=>{const e=document.createElement("div");e.className=cls;e.style.cssText=css;e.innerHTML=html;world.appendChild(e);return e};

add("floor",`width:${W}px;height:${L+700}px;transform:translate3d(${-W/2}px,${H/2}px,700px) rotateX(-90deg)`);
add("ceil", `width:${W}px;height:${L+700}px;transform:translate3d(${-W/2}px,${-H/2}px,700px) rotateX(-90deg)`);
add("wall", `width:${L+700}px;height:${H}px;transform:translate3d(${-W/2}px,${-H/2}px,700px) rotateY(90deg)`);
add("wall", `width:${L+700}px;height:${H}px;transform:translate3d(${W/2}px,${-H/2}px,${-L}px) rotateY(-90deg)`);
const endEl=add("end",`transform:translate3d(${-W/2}px,${-H/2}px,${-L}px)`,"Your CV unrolls<br>ahead ↓");

M.forEach((m,i)=>{
  const z=START+i*GAP, zc=z+PW/2, left=i%2===0;
  const tf=left?`translate3d(${-W/2+2}px,${-PH/2}px,${-z}px) rotateY(90deg)`
               :`translate3d(${W/2-2}px,${-PH/2}px,${-(z+PW)}px) rotateY(-90deg)`;
  const pn=add("pn",`transform:${tf}`,`<span class="yr">${m.y}</span><span class="kd">${m.k}</span><h3>${m.t}</h3><p>${m.s||""}</p>`);
  const lamp=add("lamp",`transform:translate3d(-80px,${-H/2+1}px,${-(zc-80)}px) rotateX(-90deg)`);
  const pool=add("pool",`transform:translate3d(-170px,${H/2-1}px,${-(zc-170)}px) rotateX(-90deg)`);
  items.push({m,zc,els:[pn,lamp,pool]});
});

/* ---------- 3. Scroll-driven walking ---------- */
const space=$("#space"), reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const cv=$("#cv"), hint=$("#hint"), hy=$("#hy"), bar=$("#bar i");
let cur=0, tgt=0, prog=0, open=false;

function size(){
  space.style.height=(n*55+100)+"vh";
  $("#stage").style.perspective=Math.max(600,innerWidth*.9)+"px";
}
function onScroll(){
  const max=document.documentElement.scrollHeight-innerHeight;
  prog=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
  tgt=prog*MAXD;
  hint.style.opacity=prog>.02?0:1;
  if(!open&&prog>.985)setOpen(true);
  else if(open&&prog<.96)setOpen(false);
}
function setOpen(v){open=v;cv.classList.toggle("open",v);if(v)cv.scrollTop=0}
const goEnd=()=>scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"});
const goBack=()=>{const max=document.documentElement.scrollHeight-innerHeight;scrollTo({top:max*.92,behavior:"smooth"})};

function frame(){
  cur+=reduce?(tgt-cur):(tgt-cur)*.08;
  const bob=reduce?0:Math.sin(cur*.018)*3;
  world.style.transform=`translateY(${bob}px) translateZ(${cur}px)`;

  let best=0,by=items[0].m.y;
  items.forEach(it=>{
    const d=it.zc-cur;                       // >0 ahead, <0 behind
    let l=d>=0?1-Math.min(d/1000,1):1-Math.min(-d/450,1);
    l=l*l*(3-2*l);
    const v=l.toFixed(3);
    it.els.forEach(e=>e.style.setProperty("--l",v));
    if(l>best){best=l;by=it.m.y}
  });
  const de=Math.max(0,1-(L-cur-600)/1000);
  endEl.style.setProperty("--l",de.toFixed(3));
  hy.textContent=by;
  bar.style.width=(prog*100)+"%";
  requestAnimationFrame(frame);
}

/* ---------- 4. Full CV (unrolls at the end) ---------- */
const rows=a=>a.map(x=>`<div class="entry"><div class="when">${x[0]}</div><div><h3>${x[1]}</h3>${x[2]?`<span class="org">${x[2]}</span>`:""}</div></div>`).join("");
const TAGS={original:"Original research",gbd:"GBD collaboration",review:"In review or in preparation"};
const SEC=[
["Education",()=>rows(D.education)],
["Experience",()=>D.jobs.map(j=>`<div class="entry"><div class="when">${j.y}</div><div><h3>${j.t}</h3><span class="org">${j.o}</span><ul>${j.b.map(b=>`<li>${b}</li>`).join("")}</ul></div></div>`).join("")],
["Publications",()=>D.pubs.map(p=>`<div class="entry pub"><span class="tag">${TAGS[p[0]]}</span>${p[1].replace("Karki P","<strong>Karki P</strong>")}${p[2]?` <a href="https://doi.org/${p[2]}" target="_blank" rel="noopener">doi:${p[2]}</a>`:""}</div>`).join("")],
["Peer review",()=>rows(D.review.map(r=>[r[1],r[0],""]))],
["Grants and awards",()=>rows(D.awards)],
["Trainings",()=>rows(D.training)],
["Volunteering",()=>rows(D.volunteer)],
