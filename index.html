<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV | Prabin Karki</title>
<meta name="description" content="Curriculum vitae of Prabin Karki, public health officer and epidemiologist in Nepal.">

<style>
:root{
  --bg:#f5f7f6;
  --card:#fff;
  --ink:#12262e;
  --mute:#566a72;
  --line:#dbe3e2;
  --acc:#0b5d63;
  --tint:#e3eeee;
  --sig:#c8821a;
  --on:#fff;
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f1b20;
    --card:#16262c;
    --ink:#e6eef0;
    --mute:#9db0b6;
    --line:#26393f;
    --acc:#6fc3c8;
    --tint:#193338;
    --sig:#e3a443;
    --on:#0b1417;
  }
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}

h1,h2,h3{
  font-family:Georgia,"Times New Roman",serif;
  line-height:1.1;
  margin:0 0 .35em;
}

h1{font-size:clamp(1.8rem,5vw,2.6rem)}

h2{
  font-size:1.35rem;
  padding-bottom:.3rem;
  border-bottom:1px solid var(--sig);
  display:inline-block;
}

h3{
  font-size:1rem;
  margin:0;
}

a{color:var(--acc)}

:focus-visible{
  outline:3px solid var(--sig);
  outline-offset:2px;
}

.wrap{
  max-width:1040px;
  margin:auto;
  padding:0 1.1rem;
}

/* ===== HEADER ===== */

header{
  position:sticky;
  top:0;
  background:rgba(8,17,22,.88);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  z-index:20;
}

header .wrap{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:.8rem;
  flex-wrap:wrap;
  padding-top:.55rem;
  padding-bottom:.55rem;
  min-height:66px;
}

.brand{
  font:700 1.15rem Georgia,serif;
  color:#F7F8F5;
  text-decoration:none;
  letter-spacing:-.02em;
}

.brand span{color:#167D8D}

nav{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:.35rem;
  flex-wrap:wrap;
  margin-left:auto;
}

nav a{
  display:inline-flex;
  align-items:center;
  min-height:15px;
  padding:.35rem .65rem;
  border:1px solid transparent;
  border-radius:8px;
  color:#B8C8CB;
  font-size:.87rem;
  text-decoration:none;
  margin-left:0;
  transition:color .2s ease,background .2s ease,border-color .2s ease;
}

nav a:hover,
nav a.on{
  color:#F7F8F5;
  background:rgba(22,125,141,.16);
  border-color:rgba(22,125,141,.42);
}

nav a.glow-button{
  color:#F7F8F5;
  background:rgba(22,125,141,.18);
  border:1px solid rgba(22,125,141,.55);
  border-radius:8px;
}

nav a.glow-button:hover{
  background:rgba(22,125,141,.3);
  border-color:#167D8D;
}

/* ===== CV CONTENT ===== */

.intro{
  padding:1.5rem 0 .8rem;
}

.role{
  color:var(--acc);
  font-weight:600;
  margin:0 0 .3rem;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:.25rem 1rem;
  color:var(--mute);
  margin:.4rem 0 0;
  padding:0;
  list-style:none;
  font-size:.9rem;
}

.tools{
  display:flex;
  flex-wrap:wrap;
  gap:.5rem;
  align-items:center;
  margin-top:.9rem;
}

.btn{
  display:inline-block;
  padding:.45rem .85rem;
  border-radius:8px;
  border:1.5px solid var(--acc);
  color:var(--acc);
  text-decoration:none;
  font:inherit;
  font-size:.9rem;
  font-weight:600;
  cursor:pointer;
  background:none;
}

.btn.pri{
  background:var(--acc);
  color:var(--on);
}

.btn:hover{filter:brightness(1.1)}

#q{
  flex:1;
  min-width:200px;
  max-width:320px;
  font:inherit;
  font-size:.9rem;
  padding:.45rem .75rem;
  border:1.5px solid var(--line);
  border-radius:8px;
  background:var(--card);
  color:var(--ink);
}

.layout{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:1.8rem;
  align-items:start;
  padding-bottom:2.5rem;
}

.rail{
  position:sticky;
  top:80px;
  display:flex;
  flex-direction:column;
  border-left:2px solid var(--line);
}

.rail a{
  padding:.25rem .8rem;
  margin-left:-2px;
  border-left:2px solid transparent;
  color:var(--mute);
  text-decoration:none;
  font-size:.87rem;
}

.rail a:hover{color:var(--ink)}

.rail a.on{
  border-left-color:var(--sig);
  color:var(--acc);
  font-weight:600;
}

.sec {
  margin-bottom: 0;
  scroll-margin-top: 90px;
}

.sec h2 {
  font-size: 1.35rem;
  padding-bottom: .2rem;
  margin-bottom: .2rem;
}

.entry{
  display:grid;
  grid-template-columns:135px 1fr;
  gap:.15rem .8rem;
  padding:.25rem 0;
  border-bottom:1px solid var(--line);
  font-size:.92rem;
  line-height:1.5;
}

.when{
  color:var(--mute);
  font-size:.85rem;
}

.org{
  display:block;
  color:var(--acc);
  font-size:.89rem;
}

details.entry{display:block}

summary{
  display:grid;
  grid-template-columns:135px 1fr 20px;
  gap:.8rem;
  cursor:pointer;
  list-style:none;
}

summary::-webkit-details-marker{display:none}

summary::after{
  content:"+";
  color:var(--sig);
  font-size:1.2rem;
  line-height:1;
  text-align:center;
  transition:transform .2s;
}

details[open] summary::after{
  transform:rotate(45deg);
}

details ul{
  margin:.35rem 0 .2rem 150px;
  padding-left:1rem;
  max-width:66ch;
  font-size:.9rem;
  line-height:1.5;
}

details li{margin-bottom:.2rem}

.pub{
  display:block;
  max-width:80ch;
  font-size:.9rem;
  line-height:1.5;
  padding:.3rem 0;
}

.tag{
  color:var(--sig);
  font-size:.78rem;
  font-weight:600;
  display:block;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:.35rem;
  padding:0;
  list-style:none;
  margin:.4rem 0 0;
}

.chips li{
  background:var(--tint);
  color:var(--acc);
  padding:.2rem .65rem;
  border-radius:99px;
  font-size:.82rem;
}

.flt{
  display:flex;
  flex-wrap:wrap;
  gap:.35rem;
  margin:.5rem 0 .15rem;
}

.flt .btn{
  padding:.25rem .7rem;
  font-size:.83rem;
}

.flt .btn.on{
  background:var(--acc);
  color:var(--on);
}

#none{
  padding:1.5rem 0;
  color:var(--mute);
}

footer{
  border-top:1px solid var(--line);
  padding:1rem 0;
  color:var(--mute);
  font-size:.85rem;
}

/* ===== RESPONSIVE ===== */

@media(max-width:820px){

  header .wrap{
    justify-content:center;
  }

  header nav{
    justify-content:center;
    margin-left:0;
  }

  .layout{
    grid-template-columns:1fr;
    gap:.6rem;
  }

  .rail{
    position:sticky;
    top:66px;
