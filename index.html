const $=s=>document.querySelector(s);
const yr=s=>(String(s).match(/\d{4}/)||[""])[0];
const clip=(t,n)=>t.length>n?t.slice(0,n-1)+"…":t;
const strip=h=>h.replace(/<[^>]+>/g,"");

/* 1. milestones, oldest first */
const M=[];
D.education.slice().reverse().forEach(e=>M.push({y:yr(e[0]),k:"Education",t:e[1],s:e[2],w:e[0],d:[]}));
D.jobs.slice().reverse().forEach(j=>M.push({y:yr(j.y),k:"Role",t:j.t,s:j.o,w:j.y,d:j.b.slice(0,3)}));
D.awards.slice().reverse().forEach(a=>M.push({y:yr(a[0]),k:"Award",t:a[1],s:a[2],w:a[0],d:[]}));
D.pubs.filter(p=>p[0]==="original").forEach(p=>{const c=strip(p[1]),parts=c.split(". ");
  M.push({y:(c.match(/\b(20\d\d)\b/)||["",""])[1],k:"Publication",t:parts[1]||c,s:parts[2]||"",d:[c]})});
M.sort((a,b)=>a.y-b.y);

/* 2. curved path: heading = A·sin(s/R) */
const A=.6,R=1500,ST=20,S=100,GAP=480,START=700,n=M.length,L=START+n*GAP+700,MAXD=L-420;
const hd=s=>A*Math.sin(s/R);
const PX=[0],PZ=[0];
for(let i=1;i<=L/ST+80;i++){const h=hd((i-.5)*ST);PX[i]=PX[i-1]+Math.sin(h)*ST;PZ[i]=PZ[i-1]-Math.cos(h)*ST}
const at=s=>{const f=Math.max(0,s)/ST,i=Math.floor(f),t=f-i;return[PX[i]+(PX[i+1]-PX[i])*t,PZ[i]+(PZ[i+1]-PZ[i])*t,hd(s)]};

  world.appendChild(e);const o={e,s,v:true};objs.push(o);if(isLit)lit.push(o);return o};

{const [x,z,h]=at(L-300);mk("gate",`translate3d(${x}px,0,${z}px) rotateY(${-h}rad)`,`<div>Your full CV<br>unrolls ↓</div>`,L-300)}

const pts=[];for(let s=0;s<=L;s+=150){const[a,b]=at(s);pts.push([-b,a])}
const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
const sx=v=>6+(v-x0)/(x1-x0||1)*108,sy=v=>6+(v-y0)/(y1-y0||1)*44;
$("#mm").innerHTML=`<polyline points="${pts.map(p=>sx(p[0]).toFixed(1)+","+sy(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="#0b5d63" stroke-width="2" stroke-linecap="round"/><circle id="dot" r="4" fill="#c8821a"/>`;
const dot=$("#dot");

/* 4. scroll-driven walking */
const space=$("#space"),cv=$("#cv"),hint=$("#hint"),hy=$("#hy"),bar=$("#bar i"),stage=$("#stage");
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
let cur=0,tgt=0,prog=0,open=false,auto=false;
const size=()=>{space.style.height=(n*60+120)+"vh";stage.style.perspective=Math.max(650,Math.min(1000,innerWidth*.8))+"px"};
const setOpen=v=>{open=v;cv.classList.toggle("open",v);if(v){auto=false;$("#auto").classList.remove("on");$("#auto").textContent="▶ Auto-walk";cv.scrollTop=0}};
function onScroll(){
  const max=document.documentElement.scrollHeight-innerHeight;
  prog=max>0?Math.min(1,Math.max(0,scrollY/max)):0;tgt=prog*MAXD;
  hint.style.opacity=prog>.02?0:1;
  if(!open&&prog>.985)setOpen(true);else if(open&&prog<.96)setOpen(false);
}
function frame(){
  if(auto&&!open)scrollBy(0,3);
  cur+=reduce?tgt-cur:(tgt-cur)*.07;
  const [x,z]=at(cur),h=hd(cur+140),dh=A/R*Math.cos(cur/R);
  const bob=reduce?0:Math.sin(cur*.03)*3,roll=reduce?0:-dh*2600;
  world.style.transform=`rotateZ(${roll}deg) rotateY(${h}rad) translate3d(${-x}px,${bob}px,${-z}px)`;
  objs.forEach(o=>{const v=o.s>cur-600&&o.s<cur+3100;if(v!==o.v){o.v=v;o.e.style.display=v?"":"none"}});
  let best=0,by=hy.textContent;
  lit.forEach((o,k)=>{const d=o.s-cur+150;let l=d>=0?1-Math.min(d/900,1):1-Math.min(-d/350,1);l=l*l*(3-2*l);
    o.e.style.setProperty("--l",l.toFixed(3));if(l>best&&(k%2===0)){best=l;by=M[k>>1].y}});
  hy.textContent=by;bar.style.width=prog*100+"%";
  const p=at(cur);dot.setAttribute("cx",sx(-p[1]).toFixed(1));dot.setAttribute("cy",sy(p[0]).toFixed(1));
  requestAnimationFrame(frame);
}

/* 5. full CV */
const rows=a=>a.map(x=>`<div class="entry"><div class="when">${x[0]}</div><div><h3>${x[1]}</h3>${x[2]?`<span class="org">${x[2]}</span>`:""}</div></div>`).join("");
const TAGS={original:"Original research",gbd:"GBD collaboration",review:"In review or in preparation"};
const SEC=[["Education",()=>rows(D.education)],
["Experience",()=>D.jobs.map(j=>`<div class="entry"><div class="when">${j.y}</div><div><h3>${j.t}</h3><span class="org">${j.o}</span><ul>${j.b.map(b=>`<li>${b}</li>`).join("")}</ul></div></div>`).join("")],
["Publications",()=>D.pubs.map(p=>`<div class="entry pub"><span class="tag">${TAGS[p[0]]}</span>${p[1].replace("Karki P","<strong>Karki P</strong>")}${p[2]?` <a href="https://doi.org/${p[2]}" target="_blank" rel="noopener">doi:${p[2]}</a>`:""}</div>`).join("")],
["Peer review",()=>rows(D.review.map(r=>[r[1],r[0],""]))],["Grants and awards",()=>rows(D.awards)],
["Trainings",()=>rows(D.training)],["Volunteering",()=>rows(D.volunteer)],
["Skills",()=>`<ul class="chips">${D.skills.map(s=>`<li>${s}</li>`).join("")}</ul>`]];
$("#content").innerHTML=SEC.map(s=>`<section class="sec"><h2>${s[0]}</h2>${s[1]()}</section>`).join("");

/* 6. wiring */
const goEnd=()=>scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"});
const goBack=()=>scrollTo({top:(document.documentElement.scrollHeight-innerHeight)*.9,behavior:"smooth"});
addEventListener("scroll",onScroll,{passive:true});
addEventListener("resize",()=>{size();onScroll()});
$("#skip").onclick=goEnd;$("#back").onclick=goBack;$("#prt").onclick=()=>print();
$("#auto").onclick=e=>{auto=!auto;e.target.classList.toggle("on",auto);e.target.textContent=auto?"❚❚ Pause":"▶ Auto-walk"};
cv.addEventListener("wheel",e=>{if(e.deltaY<0&&cv.scrollTop<=0)goBack()},{passive:true});
addEventListener("keydown",e=>{if(e.key==="Escape"&&open)goBack()});
stage.addEventListener("click",e=>{const m=e.target.closest(".ms");document.querySelectorAll(".ms.tap").forEach(x=>{if(x!==m)x.classList.remove("tap")});if(m)m.classList.toggle("tap")});
size();onScroll();requestAnimationFrame(frame);
</script>
</body>
</html>
