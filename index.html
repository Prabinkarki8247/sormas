<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV | Prabin Karki</title>
<style>
:root{--ink:#12262e;--mute:#566a72;--line:#dbe3e2;--acc:#0b5d63;--tint:#e3eeee;--sig:#c8821a}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0 0 .3em}
a{color:var(--acc)}
header{position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(8,17,22,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header .wrap{max-width:1040px;margin:auto;padding:.55rem 1.1rem;display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;min-height:60px}
.brand{font:700 1.15rem Georgia,serif;color:#F7F8F5;text-decoration:none}.brand span{color:#167D8D}
nav{display:flex;gap:.35rem;flex-wrap:wrap;margin-left:auto}
nav a{padding:.35rem .65rem;border:1px solid transparent;border-radius:8px;color:#B8C8CB;font-size:.87rem;text-decoration:none}
nav a:hover,nav a.on{color:#F7F8F5;background:rgba(22,125,141,.16);border-color:rgba(22,125,141,.42)}
nav a.glow-button{color:#F7F8F5;background:rgba(22,125,141,.18);border-color:rgba(22,125,141,.55)}

/* ---- world ---- */
#space{width:1px}
#stage{position:fixed;inset:0;overflow:hidden;perspective:800px;background:#fff}
#world{position:absolute;left:50%;top:52%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
#world>*{position:absolute;left:0;top:0;transform-style:preserve-3d}
.g i{position:absolute;left:0;top:0;display:block;transform-origin:0 0}
.fl{width:500px;height:110px;transform:translate3d(-250px,170px,-105px) rotateX(90deg);background:linear-gradient(90deg,#cfd7d7 1px,transparent 1px) 0 0/62.5px 100%,#e9eded}
.fl .fp{position:absolute;left:190px;width:120px;top:0;bottom:0;background:repeating-linear-gradient(180deg,#0b5d63 0 74px,transparent 74px 100px)}
.fl::before,.fl::after{content:"";position:absolute;top:0;bottom:0;width:6px;background:radial-gradient(circle,#d79a2e 2.5px,transparent 3.5px) 0 0/6px 50px}
.fl::before{left:177px}.fl::after{left:317px}
.cl{width:500px;height:110px;transform:translate3d(-250px,-170px,5px) rotateX(-90deg);background:#f3f6f6}
.cl .lt{position:absolute;left:190px;top:10px;width:120px;height:80px;background:#fff;box-shadow:0 0 40px 22px rgba(255,232,180,.75)}
.wl{width:110px;height:340px;background:linear-gradient(#fff 0,#f9fbfb 64%,#e2e9e9 64%,#e2e9e9 93%,#a9b8b8 93%)}
.wl::before{content:"";position:absolute;left:0;right:0;top:36%;height:2px;background:rgba(11,93,99,.25)}
.wl::after{content:"";position:absolute;top:0;bottom:0;right:0;border-right:1px solid #dde5e5}
.wl.l{transform:translate3d(-250px,-170px,5px) rotateY(90deg)}
.wl.r{transform:translate3d(250px,-170px,-105px) rotateY(-90deg);background:linear-gradient(#f6f9f9 0,#f1f5f5 64%,#dae2e2 64%,#dae2e2 93%,#a0b0b0 93%)}

/* milestone: tile + board on the wall */
.ms .tl,.ms .bd{position:absolute;background:#fff;border-radius:6px}
.ms .tl{left:-85px;top:-62px;width:170px;height:124px;padding:10px 14px;cursor:pointer;
 border:1px solid rgba(11,93,99,calc(.2 + var(--l,0)*.7));
 box-shadow:0 8px 26px rgba(11,93,99,calc(.08 + var(--l,0)*.3));
 transform:translateZ(calc(14px + var(--l,0)*12px));opacity:calc(.6 + var(--l,0)*.4)}
.yr{display:block;font:700 2.3rem/1 Georgia,serif;color:var(--sig)}
.kd{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:600}
.tl h3{font-size:.92rem;margin:.3rem 0 0}
.bd{left:-200px;top:-140px;width:400px;height:280px;padding:16px 22px;overflow:hidden;opacity:0;pointer-events:none;
 border:1px solid #cfd9d9;box-shadow:0 24px 60px rgba(0,0,0,.28);
 transform:translateZ(14px) scale(.3) rotateX(45deg);transition:transform .5s cubic-bezier(.2,1.3,.4,1),opacity .3s}
.ms:hover .bd,.ms.tap .bd{opacity:1;pointer-events:auto;transform:translateZ(36px) scale(1) rotateX(0)}
.bd h3{font-size:1.15rem}.bd em{display:block;color:var(--acc);font-size:.84rem;margin-bottom:.3rem}
.bd ul{margin:.3rem 0 0;padding-left:1.1rem;font-size:.8rem;line-height:1.4;color:#33464d}
.bd li{margin-bottom:.25rem}
.pq div{position:absolute;left:-70px;top:-32px;width:140px;height:64px;display:grid;place-items:center;border:2px solid var(--sig);border-radius:8px;background:#fff;
 font:700 2rem Georgia,serif;color:var(--sig);opacity:calc(.4 + var(--l,0)*.6);box-shadow:0 0 calc(var(--l,0)*40px) rgba(200,130,26,.6)}
.pt b{position:absolute;display:block;border-radius:50%;background:radial-gradient(circle,rgba(200,130,26,.9),rgba(200,130,26,0) 70%);animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-30px)}}
.gate div{position:absolute;left:-250px;top:-170px;width:500px;height:340px;display:grid;place-items:center;text-align:center;
 background:radial-gradient(circle,#fff 30%,#fdf1d9);font:700 2rem Georgia,serif;color:var(--sig);box-shadow:0 0 140px 80px #fff}

.fog{position:fixed;inset:0;z-index:5;pointer-events:none;
 background:radial-gradient(ellipse 36% 44% at 50% 52%,rgba(255,255,255,.97) 0,rgba(255,255,255,0) 100%),radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(11,93,99,.1) 100%)}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1rem;color:var(--mute);font-size:.85rem;background:linear-gradient(transparent,rgba(255,255,255,.9))}
#hud b{font:700 1.5rem Georgia,serif;color:var(--sig);min-width:3.4ch}
#bar{flex:1;height:3px;background:#dbe3e2;border-radius:3px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--sig)}
#mm{width:120px;height:56px}
.b2{color:var(--acc);background:#fff;border:1.5px solid var(--acc);border-radius:8px;padding:.3rem .7rem;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.b2.on{background:var(--acc);color:#fff}
#hint{position:fixed;left:50%;bottom:4.6rem;transform:translateX(-50%);z-index:20;color:var(--acc);font-weight:600;letter-spacing:.08em;animation:bob 1.6s ease-in-out infinite;transition:opacity .5s}
@keyframes bob{50%{transform:translate(-50%,8px)}}

/* full CV */
#cv{position:fixed;inset:0;z-index:30;background:#f5f7f6;overflow:auto;overscroll-behavior:contain;padding-top:80px;clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path 1.3s cubic-bezier(.65,0,.25,1),visibility 0s 1.3s}
#cv.open{clip-path:inset(0);visibility:visible;transition:clip-path 1.3s cubic-bezier(.65,0,.25,1)}
.wrap2{max-width:960px;margin:auto;padding:0 1.1rem}
.meta{display:flex;flex-wrap:wrap;gap:.25rem 1rem;color:var(--mute);margin:.4rem 0;padding:0;list-style:none;font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;margin:.9rem 0 1.2rem}
.btn{display:inline-block;padding:.45rem .85rem;border-radius:8px;border:1.5px solid var(--acc);color:var(--acc);text-decoration:none;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;background:none}
.btn.pri{background:var(--acc);color:#fff}
.sec{margin:0 0 1rem}.sec h2{font-size:1.35rem;padding-bottom:.2rem;border-bottom:1px solid var(--sig);display:inline-block}
.entry{display:grid;grid-template-columns:135px 1fr;gap:.15rem .8rem;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.92rem}
.when{color:var(--mute);font-size:.85rem}.org{display:block;color:var(--acc);font-size:.89rem}
.entry h3{font-size:1rem;margin:0}.entry ul{margin:.3rem 0;padding-left:1.1rem;font-size:.9rem}
.pub{display:block;max-width:80ch}.tag{color:var(--sig);font-size:.78rem;font-weight:600;display:block}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;padding:0;list-style:none}
.chips li{background:var(--tint);color:var(--acc);padding:.2rem .65rem;border-radius:99px;font-size:.82rem}
footer{padding:1rem 0 2rem;color:var(--mute);font-size:.85rem}
@media(max-width:640px){.entry{grid-template-columns:1fr}#mm{display:none}}
@media print{header,#stage,#hud,#hint,.fog,.tools{display:none!important}#cv{position:static;clip-path:none;visibility:visible;padding:0}.entry{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="index.html#top">Prabin <span>Karki</span></a>
  <nav aria-label="Main navigation">
    <a href="index.html#about">About</a><a href="index.html#portfolio">Portfolio</a>
    <a href="cv.html" class="on" aria-current="page">CV</a><a href="resources.html">Resources</a>
    <a href="index.html#contact">Contact</a><a href="work_with_me.html" class="glow-button">Work with me ↗</a>
  </nav>
</div></header>

<div id="space"></div>
<div id="stage"><div id="world"></div></div>
<div class="fog"></div>
<div id="hint">Scroll to walk ↓ · hover a tile</div>
<div id="hud"><b id="hy">2011</b><div id="bar"><i></i></div>
  <svg id="mm" viewBox="0 0 120 56" aria-hidden="true"></svg>
  <button class="b2" id="auto" type="button">▶ Auto-walk</button>
  <button class="b2" id="skip" type="button">Skip to CV</button></div>

<main id="cv" aria-label="Full curriculum vitae"><div class="wrap2">
  <h1>Curriculum vitae</h1>
  <ul class="meta"><li>Prabin Karki</li><li>Kathmandu, Nepal</li>
    <li><a href="mailto:prabinkarki8247@gmail.com">prabinkarki8247@gmail.com</a></li>
    <li><a href="https://orcid.org/0000-0002-5884-1254" target="_blank" rel="noopener">ORCID 0000-0002-5884-1254</a></li></ul>
  <div class="tools"><a class="btn pri" href="Prabin_Karki_CV.pdf" download>Download PDF</a>
    <button class="btn" id="prt" type="button">Print</button>
    <button class="btn" id="back" type="button">↑ Back to corridor</button></div>
  <div id="content"></div>
  <footer>© 2026 Prabin Karki. Kathmandu, Nepal.</footer>
</div></main>

<script>
/* ===== PASTE YOUR const D={ ... }; BLOCK HERE (from the previous version) ===== */

const $=s=>document.querySelector(s);
const yr=s=>(String(s).match(/\d{4}/)||[""])[0];
const clip=(t,n)=>t.length>n?t.slice(0,n-1)+"…":t;
const strip=h=>h.replace(/<[^>]+>/g,"");

/* 1. milestones, oldest first */
const M=[];
D.education.slice().reverse().forEach(e=>M.push({y:yr(e[0]),k:"Education",t:e[1],s:e[2],d:[]}));
D.jobs.slice().reverse().forEach(j=>M.push({y:yr(j.y),k:"Role",t:j.t,s:j.o,w:j.y,d:j.b.slice(0,3)}));
D.awards.slice().reverse().forEach(a=>M.push({y:yr(a[0]),k:"Award",t:a[1],s:a[2],d:[]}));
D.pubs.filter(p=>p[0]==="original").forEach(p=>{const c=strip(p[1]);M.push({y:(c.match(/\b(20\d\d)\b/)||["",""])[1],k:"Publication",t:c.split(". ")[1],s:"",d:[c]})});
M.sort((a,b)=>a.y-b.y);

/* 2. the curved path: heading = A·sin(s/R) */
const A=.6,R=1500,ST=20,S=100,GAP=480,START=700,n=M.length,L=START+n*GAP+700,MAXD=L-420;
const hd=s=>A*Math.sin(s/R);
const PX=[0],PZ=[0];
for(let i=1;i<=L/ST+80;i++){const h=hd((i-.5)*ST);PX[i]=PX[i-1]+Math.sin(h)*ST;PZ[i]=PZ[i-1]-Math.cos(h)*ST}
const at=s=>{const f=Math.max(0,s)/ST,i=Math.floor(f),t=f-i;return[PX[i]+(PX[i+1]-PX[i])*t,PZ[i]+(PZ[i+1]-PZ[i])*t,hd(s)]};

/* 3. build the world */
const world=$("#world"),objs=[],lit=[];
const mk=(cls,tf,html,s,isLit)=>{const e=document.createElement("div");e.className="o "+cls;e.style.transform=tf;e.innerHTML=html||"";world.appendChild(e);const o={e,s,v:true};objs.push(o);if(isLit)lit.push(o);return o};
for(let i=0;i<=L/S;i++){
  const [x,z]=at(i*S),h=hd(i*S+S/2);
  const g=mk("g",`translate3d(${x}px,0,${z}px) rotateY(${-h}rad)`,`<i class="fl"><b class="fp"></b></i><i class="cl">${i%2?"":'<b class="lt"></b>'}</i><i class="wl l"></i><i class="wl r"></i>`,i*S+50);
}
M.forEach((m,i)=>{
  const s=START+i*GAP,side=i%2?1:-1,[x,z,h]=at(s);
  const lines=(m.d.length?m.d:[]).map(t=>`<li>${clip(t,m.k==="Publication"?260:150)}</li>`).join("");
  mk("ms",`translate3d(${x}px,0,${z}px) rotateY(${-h}rad) translate3d(${side*247}px,0,0) rotateY(${-side*90}deg)`,
   `<div class="tl"><span class="yr">${m.y}</span><span class="kd">${m.k}</span><h3>${clip(m.t,46)}</h3></div>
    <div class="bd"><span class="kd">${m.k} · ${m.w||m.y}</span><h3>${m.t}</h3>${m.s?`<em>${m.s}</em>`:""}<ul>${lines}</ul></div>`,s,true);
  mk("pq",`translate3d(${x}px,169px,${z}px) rotateY(${-h}rad) rotateX(90deg)`,`<div>${m.y}</div>`,s,true);
});
for(let i=0;i<36;i++){
  const s=Math.random()*(MAXD+800),[x,z,h]=at(s),sz=6+Math.random()*9;
  mk("pt",`translate3d(${x}px,0,${z}px) rotateY(${-h}rad) translate3d(${(Math.random()-.5)*420}px,${-150+Math.random()*260}px,0)`,
    `<b style="width:${sz}px;height:${sz}px;animation-delay:${-Math.random()*4}s"></b>`,s);
}
{const [x,z,h]=at(L-300);mk("gate",`translate3d(${x}px,0,${z}px) rotateY(${-h}rad)`,`<div>Your full CV<br>unrolls ↓</div>`,L-300)}

/* minimap */
const pts=[];for(let s=0;s<=L;s+=150){const[a,b]=at(s);pts.push([-b,a])}
const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
const sx=v=>6+(v-x0)/(x1-x0||1)*108,sy=v=>6+(v-y0)/(y1-y0||1)*44;
$("#mm").innerHTML=`<polyline points="${pts.map(p=>sx(p[0]).toFixed(1)+","+sy(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="#0b5d63" stroke-width="2" stroke-linecap="round"/><circle id="dot" r="4" fill="#c8821a"/>`;
const dot=$("#dot");

/* 4. scroll-driven walking */
const space=$("#space"),cv=$("#cv"),hint=$("#hint"),hy=$("#hy"),bar=$("#bar i"),stage=$("#stage");
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
let cur=0,tgt=0,prog=0,open=false,auto=false;
const size=()=>{space.style.height=(n*60+120)+"vh";stage.style.perspective=Math.max(650,Math.min(1000,innerWidth*.8))+"px"};
const setOpen=v=>{open=v;cv.classList.toggle("open",v);if(v){auto=false;$("#auto").classList.remove("on");cv.scrollTop=0}};
function onScroll(){
  const max=document.documentElement.scrollHeight-innerHeight;
  prog=max>0?Math.min(1,Math.max(0,scrollY/max)):0;tgt=prog*MAXD;
  hint.style.opacity=prog>.02?0:1;
  if(!open&&prog>.985)setOpen(true);else if(open&&prog<.96)setOpen(false);
}
function frame(){
  if(auto&&!open)scrollBy(0,3);
  cur+=reduce?tgt-cur:(tgt-cur)*.07;
  const [x,z]=at(cur),h=hd(cur+140),dh=A/R*Math.cos(cur/R);
  const bob=reduce?0:Math.sin(cur*.03)*3,roll=reduce?0:-dh*2600;
  world.style.transform=`rotateZ(${roll}deg) rotateY(${h}rad) translate3d(${-x}px,${bob}px,${-z}px)`;
  objs.forEach(o=>{const v=o.s>cur-350&&o.s<cur+3100;if(v!==o.v){o.v=v;o.e.style.display=v?"":"none"}});
  let best=0,by=hy.textContent;
  lit.forEach(o=>{const d=o.s-cur;let l=d>=0?1-Math.min(d/900,1):1-Math.min(-d/350,1);l=l*l*(3-2*l);
    o.e.style.setProperty("--l",l.toFixed(3));if(l>best&&o.e.classList.contains("ms")){best=l;by=M[lit.indexOf(o)>>1].y}});
  hy.textContent=by;bar.style.width=prog*100+"%";
  dot.setAttribute("cx",sx(-at(cur)[1]).toFixed(1));dot.setAttribute("cy",sy(at(cur)[0]).toFixed(1));
  requestAnimationFrame(frame);
}

/* 5. full CV */
const rows=a=>a.map(x=>`<div class="entry"><div class="when">${x[0]}</div><div><h3>${x[1]}</h3>${x[2]?`<span class="org">${x[2]}</span>`:""}</div></div>`).join("");
const TAGS={original:"Original research",gbd:"GBD collaboration",review:"In review or in preparation"};
const SEC=[["Education",()=>rows(D.education)],
["Experience",()=>D.jobs.map(j=>`<div class="entry"><div class="when">${j.y}</div><div><h3>${j.t}</h3><span class="org">${j.o}</span><ul>${j.b.map(b=>`<li>${b}</li>`).join("")}</ul></div></div>`).join("")],
["Publications",()=>D.pubs.map(p=>`<div class="entry pub"><span class="tag">${TAGS[p[0]]}</span>${p[1].replace("Karki P","<strong>Karki P</strong>")}${p[2]?` <a href="https://doi.org/${p[2]}" target="_blank" rel="noopener">doi:${p[2]}</a>`:""}</div>`).join("")],
["Peer review",()=>rows(D.review.map(r=>[r[1],r[0],""]))],["Grants and awards",()=>rows(D.awards)],
["Trainings",()=>rows(D.training)],["Volunteering",()=>rows(D.volunteer)],
["Skills",()=>`<ul class="chips">${D.skills.map(s=>`<li>${s}</li>`).join("")}</ul>`]];
$("#content").innerHTML=SEC.map(s=>`<section class="sec"><h2>${s[0]}</h2>${s[1]()}</section>`).join("");

/* 6. wiring */
const goEnd=()=>scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"});
const goBack=()=>scrollTo({top:(document.documentElement.scrollHeight-innerHeight)*.9,behavior:"smooth"});
addEventListener("scroll",onScroll,{passive:true});
addEventListener("resize",()=>{size();onScroll()});
$("#skip").onclick=goEnd;$("#back").onclick=goBack;$("#prt").onclick=()=>print();
$("#auto").onclick=e=>{auto=!auto;e.target.classList.toggle("on",auto);e.target.textContent=auto?"❚❚ Pause":"▶ Auto-walk"};
cv.addEventListener("wheel",e=>{if(e.deltaY<0&&cv.scrollTop<=0)goBack()},{passive:true});
addEventListener("keydown",e=>{if(e.key==="Escape"&&open)goBack()});
stage.addEventListener("click",e=>{const m=e.target.closest(".ms");document.querySelectorAll(".ms.tap").forEach(x=>{if(x!==m)x.classList.remove("tap")});if(m)m.classList.toggle("tap")});
size();onScroll();requestAnimationFrame(frame);
</script>
</body>
</html>
